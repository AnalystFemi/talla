name = "talla-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-28"

[[d1_databases]]
binding = "DB"
database_name = "talla"
database_id = "14e2db4e-d6a4-4111-8e45-662df9267afd"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "talla-media"

[vars]
BASETEN_BASE_URL = "https://inference.baseten.co/v1"
BASETEN_MODEL = "meta-models/muse-spark-open-1026"

# Secrets (set with: wrangler secret put NAME) — never put real keys here:
# BASETEN_API_KEY, META_API_KEY, FIRECRAWL_API_KEY, EXA_API_KEY, AVA_API_KEY
