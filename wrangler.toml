name = "talla-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-28"
# No nodejs_compat: the Worker uses only Web APIs (btoa/atob, crypto,
# AbortSignal.timeout) — base64 is chunked btoa, never Node's Buffer.

[[d1_databases]]
binding = "DB"
database_name = "talla"
database_id = "14e2db4e-d6a4-4111-8e45-662df9267afd"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "talla-media"

[vars]
BASETEN_BASE_URL = "https://inference.baseten.co/v1"
BASETEN_MODEL = "meta-models/muse-spark-open-1026"
# Comma-separated browser origins allowed by CORS (http://localhost:5173 is
# always allowed for local dev). Placeholder — set to the real Pages URL.
ALLOWED_ORIGINS = "https://talla.pages.dev"

# Secrets (set with: wrangler secret put NAME) — never put real keys here:
#   BASETEN_API_KEY, META_API_KEY, FIRECRAWL_API_KEY, EXA_API_KEY,
#   TALLA_ACCESS_CODE        (X-Talla-Access; unset = everyone is demo-only)
#   MODAL_ENDPOINT_TOKEN     (sent as X-Talla-Token; same value as Modal secret talla-endpoint-auth)
#   MODAL_TTS_ENDPOINT, MODAL_YARN_ENDPOINT,
#   MODAL_WAN_ENDPOINT, MODAL_WAN_RESULT_ENDPOINT,
#   MODAL_STITCH_ENDPOINT, MODAL_STITCH_RESULT_ENDPOINT,
#   MODAL_FILE_ENDPOINT
# NEVER set TALLA_DEV_OPEN on the deployed Worker (local dev only: opens access).
